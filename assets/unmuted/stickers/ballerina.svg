    <path d="M450,520 C440,600 455,650 470,690 L554,690 C569,650 584,600 574,520 C540,505 484,505 450,520 Z" fill="#ff7fae" stroke="#2a1c14" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M300,700 C330,650 420,645 512,655 C604,645 694,650 724,700 C700,725 680,705 655,730 C630,705 610,735 585,712 C560,740 535,712 512,738 C489,712 464,740 439,712 C414,735 394,705 369,730 C344,705 324,725 300,700 Z" fill="#ffc2da" stroke="#2a1c14" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M330,690 C380,670 450,668 512,675 C574,668 644,670 694,690" fill="none" stroke="#ff9cc4" stroke-width="8"/>
    <!-- The saucer for a collar, and the cup for a head, with its handle. -->
    <ellipse cx="512" cy="508" rx="130" ry="30" fill="#fdf6ec" stroke="#2a1c14" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M606,330 C700,330 700,440 600,440" fill="none" stroke="#2a1c14" stroke-width="44"/>
    <path d="M606,330 C700,330 700,440 600,440" fill="none" stroke="#fdf6ec" stroke-width="24"/>
